# Runtime policy for keel processes (negentropy-style: repo-rooted, defaults safe).
# Missing or empty file => same defaults as below. Malformed file => keel
# refuses to boot. Cascade: default < file < KEEL_* env (KEEL_LISTEN_PORT,
# KEEL_STORE_KIND, ...); the environment is read only through this cascade
# (plumb docs/config.md).

[listen]
host = "127.0.0.1"
port = 3000
prefix = ""
# prefix = "/api"

[store]
kind = "memory"
# kind = "file"
# path = ".local/keel.sqlite"
