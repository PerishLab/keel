[workspace]
resolver = "3"
members = ["crates/keel", "crates/macro", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishLab/keel"

[workspace.dependencies]
axum = "0.8"
keel = { path = "crates/keel" }
keel-macro = { path = "crates/macro" }
proc-macro2 = "1"
quote = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
toml = "0.8"
