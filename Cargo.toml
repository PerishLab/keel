[workspace]
resolver = "3"
members = ["crates/keel", "crates/macro", "crates/api", "crates/gate", "crates/relay", "crates/blob"]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "MIT"
repository = "https://git.perish.top/PerishLab/keel"

[workspace.dependencies]
axum = "0.8"
keel = { path = "crates/keel", version = "0.1.0", registry = "perish" }
keel-gate = { path = "crates/gate", version = "0.1.0", registry = "perish" }
keel-macro = { path = "crates/macro", version = "0.1.0", registry = "perish" }
keel-relay = { path = "crates/relay", version = "0.1.0", registry = "perish" }
proc-macro2 = "1"
quote = "1"
postgres = "0.19"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
rusty-s3 = "0.7"
serde_json = "1"
url = "2"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
toml = "0.8"
