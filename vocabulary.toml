# vocabulary.toml — registered compound atoms.
#
# A multi-segment declared name is DEBT unless it appears here with a non-empty
# rationale. Under zero compromise almost every compound should be refactored
# (pushed into a namespace or renamed to one atom), NOT registered. Keep this
# list tiny; a growing list is vocabulary sprawl. An entry with an empty
# rationale does not register — the rationale requirement is enforced, not
# advisory.

[compound]
into_response = "axum's IntoResponse trait method. Not a compound this codebase composed and not one it can decompose: the name belongs to a foreign trait, so the impl site binds it rather than choosing it. The only alternative that removes it — From<Fault> for Response — costs every handler its error type, degrading Result<_, Fault> to Result<_, Response> at 29 sites, because axum has no blanket impl bridging Into<Response>. One atom here, spelled with an underscore."
