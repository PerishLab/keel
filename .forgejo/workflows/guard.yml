name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container:
      image: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ectropy
        run: |
          set -eu
          curl -fsSL https://releases.ectropy.perish.uk/manage.sh -o "$RUNNER_TEMP/manage-ectropy.sh"
          sh "$RUNNER_TEMP/manage-ectropy.sh" install --channel stable --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Guard
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          deno run \
            --allow-read \
            --allow-write \
            --allow-env \
            --allow-net \
            --allow-run \
            --config .runseal/deno.json \
            --lock .runseal/deno.lock \
            --frozen=true \
            .runseal/wrappers/guard.ts --fresh
