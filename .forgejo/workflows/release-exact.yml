name: release-exact

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Exact non-stable channel
        required: true
        default: beta
        type: string
      version:
        description: Exact non-stable version
        required: true
        type: string
      publish:
        description: Publish when true; rehearse without mutation when false
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    uses: PerishLab/actions/.forgejo/workflows/release-cargo.yml@main
    with:
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      guard_contexts: '["guard / guard (push)"]'
    secrets:
      registry_token: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
