[package]
name = "keel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["perish"]
description = "Data model description engine: models and relations only"
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[features]
default = ["http"]
http = ["dep:axum", "dep:serde_json"]
pg = ["sqlx/postgres"]

[dependencies]
plumb = { workspace = true }
axum = { workspace = true, optional = true }
keel-macro = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true }
toml = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
plumb = { workspace = true }

[[test]]
name = "cap"
path = "tests/cap/main.rs"

[[test]]
name = "query"
path = "tests/query/main.rs"

[[test]]
name = "data"
path = "tests/data/main.rs"

[[test]]
name = "bond"
path = "tests/bond/main.rs"

[[test]]
name = "pulse"
path = "tests/pulse/main.rs"
