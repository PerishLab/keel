[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "keel-api: one Keel estate served over HTTP"
publish = false

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "keel-api"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
clap = { workspace = true }
keel = { workspace = true, features = ["pg"] }
plumb = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }

[[test]]
name = "run"
path = "tests/run/main.rs"
