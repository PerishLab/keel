[package]
name = "keel-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["perish"]
description = "Keel default credential package: caller-space gate over the operator window"

[lib]
path = "src/lib.rs"

[dependencies]
axum = { workspace = true }
getrandom = { workspace = true }
keel = { workspace = true, features = ["http"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
keel-relay = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }

[[test]]
name = "forge"
path = "tests/forge/main.rs"
