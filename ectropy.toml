[[boundary]]
allow = [
    "path",
    "comment",
]
note = "ci infra; product depth and comment laws do not apply"
paths = [".forgejo/**"]

[[boundary]]
allow = [
    "path",
    "comment",
    "word",
]
note = "runseal operator adapters are guarded by deno fmt and deno check instead"
paths = [".runseal/**"]

[comment]
allow = false

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "test"

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
    "docs",
]

[scan]
exclude = ["**/target/**"]
include = [
    "crates/**/*.rs",
    "docs/**/*.md",
]

[[vocabulary.term]]
description = "Foreign axum IntoResponse trait method implemented at the framework boundary; keel cannot rename or decompose it without replacing domain error types with raw Response across handlers."
name = "into_response"

[word]
single = true
