[[boundary]]
allow = [
    "path",
    "comment",
    "word",
]
note = "runseal operator adapters are guarded by deno fmt and deno check instead"
paths = [".runseal/**"]

[comment]
allow = false

[[grant]]
paths = [
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = ["crates/*/tests/**/*.rs"]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
]

[scan]
exclude = ["**/target/**"]
include = [
    "crates/**/*.rs",
]

[[vocabulary.term]]
description = "Foreign axum IntoResponse trait method implemented at the framework boundary; keel cannot rename or decompose it without replacing domain error types with raw Response across handlers."
name = "into_response"

[[vocabulary.term]]
description = "Foreign std IntoFuture trait and method implemented so the configured bind ceremony remains directly awaitable."
name = "into_future"

[[vocabulary.term]]
description = "Foreign std IntoFuture associated type required by the awaitable bind ceremony."
name = "IntoFuture"

[[vocabulary.term]]
description = "Foreign sqlx Type trait method implemented so a null carries no parameter type and postgres infers it from the target column."
name = "type_info"

[[vocabulary.term]]
description = "Foreign sqlx Encode trait method implemented so a null encodes as a null with no payload."
name = "encode_by_ref"

[[vocabulary.term]]
description = "Foreign std FromStr trait method implementing strict human-duration parsing for estate retention."
name = "from_str"

[[vocabulary.term]]
description = "Foreign std TryFrom trait method used by serde to refuse malformed estate retention values during config load."
name = "try_from"

[word]
single = true
