[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Rust workspace members."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[[layout.file]]
name = ["docker-compose.yml"]
note = "Local PostgreSQL for manual debugging; no test depends on it."

[[layout.file]]
name = ["Containerfile"]
note = "The keel-api image wharf builds; it bakes in no configuration."

[identity]
ns = "keel"

[release]
authority = "https://releases.keel.perish.uk"
binaries = ["keel", "keel-api"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
skill = false

[release.binary.keel-api]
targets = ["x86_64-unknown-linux-gnu"]
install = false

[release.oci]
registry = "ghcr.io"
image = "perishlab/keel"
account = "PerishLab"
binary = "keel-api"

[release.cargo]
registry = "perish"
packages = ["keel-macro", "keel", "keel-relay", "keel-blob", "keel-column", "keel-gate"]
