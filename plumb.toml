[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Rust workspace members."

[[layout.seat]]
path = "charts/*"
kind = "retired"
note = "This product ships no Helm chart; the tombstone keeps the domain seat absent."

[[layout.seat]]
path = "skills/*"
kind = "retired"
note = "This product ships no skill; the tombstone keeps the domain seat absent."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
note = "Rust workspace anchors and the toolchain wharf builds with."

[[layout.file]]
name = ["docker-compose.yml"]
note = "Local PostgreSQL integration fixture."

[release]
product = "keel"
authority = "https://releases.keel.perish.uk"
skill = false

[release.cargo]
registry = "perish"
packages = ["keel-macro", "keel", "keel-relay", "keel-blob", "keel-gate"]
