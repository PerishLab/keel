[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Rust workspace members."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = ".forgejo"
note = "The canonical forge namespace."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.seat]]
path = ".plumb"
note = "Plumb-owned affirmation records."

[[layout.file]]
name = ["AGENTS.md"]
rule = ["rule://seat/affirmed"]
note = "The repository entrypoint is affirmed against its governed faces."

[[layout.file]]
name = ["LICENSE", ".gitignore"]
note = "Repository identity and ignore policy."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[[layout.file]]
name = ["plumb.toml", "ectropy.toml", "runseal.toml", "sidecar.toml"]
note = "Governance, isolation, and sidecar declarations."

[[layout.file]]
name = ["docker-compose.yml"]
note = "Local PostgreSQL integration fixture."

[release.cargo]
registry = "perish"
packages = ["keel-macro", "keel", "keel-relay", "keel-blob", "keel-gate"]
