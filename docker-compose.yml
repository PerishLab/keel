# Local postgres for keel db adapt development.
# Official image only — no custom postgres build.
#
#   docker compose up -d postgres
#   docker compose down
#
# Default URL (dev only, not for production):
#   postgres://keel:keel@127.0.0.1:5432/keel

services:
  postgres:
    image: postgres:16-alpine
    container_name: keel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
      POSTGRES_DB: keel
    ports:
      - "5432:5432"
    volumes:
      - keel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Optional: build/test against the compose network.
  #   docker compose run --rm tool cargo test --locked --workspace
  tool:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tool"]
    environment:
      KEEL_DATABASE_URL: postgres://keel:keel@postgres:5432/keel
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /src
    volumes:
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/src/target

volumes:
  keel-pg:
  cargo-registry:
  cargo-git:
  cargo-target:
